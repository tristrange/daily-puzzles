<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Queens test set</title>
    <style>
      /* Self-contained on purpose. This is a diagnostic page for one person, not
         a feature of the site: it is linked from nowhere, so it cannot appear in
         a menu, an archive, or a search result, and it cannot break the app
         because the app does not know it exists. */
      :root {
        color-scheme: light dark;
        --ink: #16181d;
        --paper: #fbfbfd;
        --line: #c9ccd4;
      }
      @media (prefers-color-scheme: dark) {
        :root { --ink: #e8e9ee; --paper: #16181d; --line: #3a3e48; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 1.5rem 1rem 4rem;
        background: var(--paper);
        color: var(--ink);
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      main { max-width: 34rem; margin: 0 auto; }
      h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
      p.hint { margin: 0 0 1.25rem; opacity: .75; font-size: .9rem; }
      .bar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: 1rem; }
      button, select {
        font: inherit; padding: .4rem .7rem; border-radius: .4rem;
        border: 1px solid var(--line); background: transparent; color: inherit;
      }
      button { cursor: pointer; }
      #timer { font-variant-numeric: tabular-nums; margin-left: auto; font-size: 1.1rem; }
      #board { display: grid; gap: 2px; touch-action: none; user-select: none; }
      .cell {
        aspect-ratio: 1; border: 0; border-radius: 3px; padding: 0;
        display: grid; place-items: center; position: relative;
        cursor: pointer;
      }
      .cell::after {
        position: absolute; line-height: 1; pointer-events: none;
      }
      /* Marks sit under the queen glyph rather than beside it, matching the board
         the rest of the site uses: a struck cell reads as dead even with a piece
         on it, and the outline carries the queen. */
      .cell[data-s="x"]::after { content: "✕"; font-size: clamp(.9rem, 4.5vw, 1.5rem); opacity: .55; }
      .cell[data-s="q"] { outline: 3px solid var(--ink); outline-offset: -3px; }
      .cell[data-s="q"]::after {
        content: "♛"; font-size: clamp(1.1rem, 6vw, 2rem); opacity: 1;
      }
      #status { margin-top: 1rem; min-height: 1.5rem; font-weight: 600; }
      #status[data-solved="1"] { color: #2e7d4f; }
      #log { margin-top: 1.5rem; }
      #log table { border-collapse: collapse; width: 100%; font-size: .9rem; }
      #log th, #log td { text-align: left; padding: .25rem .5rem .25rem 0; border-bottom: 1px solid var(--line); }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    </style>
  </head>
  <body>
    <main>
      <h1>Queens test set</h1>
      <p class="hint">
        One queen per colour, and no two touching &mdash; not even diagonally.
        Click to cycle empty &rarr; &times; &rarr; queen, or drag across cells to
        mark them dead. It says so the moment it is solved.
      </p>

      <div class="bar">
        <label for="pick" class="sr">Board</label>
        <select id="pick"></select>
        <button id="clear" type="button">Clear</button>
        <span id="timer">0:00</span>
      </div>

      <div id="board" role="grid" aria-label="Queens board"></div>
      <p id="status" role="status" aria-live="polite"></p>

      <div id="log">
        <h2 style="font-size:1rem">Times</h2>
        <table>
          <thead><tr><th>Board</th><th>Time</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>

    <script type="module">
      // Twelve hues chosen to stay apart at a glance. No letter is drawn in the
      // cell: the colour already says which region it is, and repeating it as text
      // just made the board harder to read. The region is still named in each
      // cell's accessible label, so a screen reader is not worse off for it.
      const PALETTE = [
        '#e8853f', '#7b6cd9', '#3fa9e8', '#4caf6e', '#e05c8a', '#c9a227',
        '#3fbfa8', '#8f6bb8', '#d9534f', '#5b8fd6', '#7fa617', '#b08968',
      ];

      const boardEl = document.getElementById('board');
      const pickEl = document.getElementById('pick');
      const statusEl = document.getElementById('status');
      const timerEl = document.getElementById('timer');
      const rowsEl = document.getElementById('rows');

      /** @type {{id: string, size: number, regions: number[], score: number}[]} */
      let boards = [];
      let current = null;
      /** @type {Map<number, 'q'|'x'>} */
      let marks = new Map();
      let startedAt = null;
      let elapsed = 0;
      let solved = false;

      /** One drag's worth of state: the cell it began on and whether it painted. */
      let stroke = null;

      const fmt = (ms) => {
        const s = Math.floor(ms / 1000);
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
      };

      function tick() {
        if (startedAt === null || solved) return;
        elapsed = Date.now() - startedAt;
        timerEl.textContent = fmt(elapsed);
      }
      setInterval(tick, 250);

      const cellAt = (node) => {
        const el = node instanceof Element ? node.closest('.cell') : null;
        return el ? Number(el.dataset.cell) : null;
      };

      /** Click cycles a cell, which is the same order the site's board uses. */
      function cycle(cell) {
        const now = marks.get(cell);
        if (now === undefined) marks.set(cell, 'x');
        else if (now === 'x') marks.set(cell, 'q');
        else marks.delete(cell);
      }

      /** A drag only ever marks. It must never place or remove a queen, because
       *  a stroke that crosses the board should not quietly change the answer. */
      function paint(cell) {
        if (marks.get(cell) !== 'q') marks.set(cell, 'x');
      }

      /** True when every rule holds. Used to end the game, never to hint. */
      function isSolved(size, regions) {
        const queens = [...marks].filter(([, v]) => v === 'q').map(([k]) => k);
        if (queens.length !== size) return false;
        const seen = new Set();
        for (const cell of queens) {
          if (seen.has(regions[cell])) return false;
          seen.add(regions[cell]);
          const r = Math.floor(cell / size), c = cell % size;
          for (let dr = -1; dr <= 1; dr += 1) {
            for (let dc = -1; dc <= 1; dc += 1) {
              if (dr === 0 && dc === 0) continue;
              const nr = r + dr, nc = c + dc;
              if (nr < 0 || nr >= size || nc < 0 || nc >= size) continue;
              if (marks.get(nr * size + nc) === 'q') return false;
            }
          }
        }
        return true;
      }

      function render() {
        const { size, regions } = current;
        boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
        boardEl.replaceChildren();
        for (let cell = 0; cell < regions.length; cell += 1) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cell';
          btn.dataset.cell = String(cell);
          btn.dataset.s = marks.get(cell) ?? '';
          btn.style.background = PALETTE[regions[cell] % PALETTE.length];
          btn.setAttribute('role', 'gridcell');
          btn.setAttribute(
            'aria-label',
            `Row ${Math.floor(cell / size) + 1}, column ${(cell % size) + 1}, colour ${regions[cell] + 1}` +
              (marks.get(cell) === 'q' ? ', queen' : marks.get(cell) === 'x' ? ', marked dead' : ''),
          );
          boardEl.append(btn);
        }
      }

      /** Called after every change: ends the game the moment it is won. */
      function afterChange() {
        render();
        if (solved) return;
        if (!isSolved(current.size, current.regions)) return;
        solved = true;
        tick();
        elapsed = Date.now() - startedAt;
        timerEl.textContent = fmt(elapsed);
        statusEl.dataset.solved = '1';
        statusEl.textContent = `Solved in ${fmt(elapsed)}.`;
        if (!rowsEl.querySelector(`[data-board="${current.id}"]`)) {
          const tr = document.createElement('tr');
          tr.dataset.board = current.id;
          tr.innerHTML = `<td>${current.id}</td><td>${fmt(elapsed)}</td>`;
          rowsEl.append(tr);
        }
      }

      function start() {
        if (startedAt === null) startedAt = Date.now();
      }

      boardEl.addEventListener('pointerdown', (event) => {
        const cell = cellAt(event.target);
        if (cell === null) return;
        event.preventDefault();
        start();
        stroke = { cell, painted: false };
        boardEl.setPointerCapture?.(event.pointerId);
      });

      boardEl.addEventListener('pointermove', (event) => {
        if (stroke === null) return;
        const cell = cellAt(event.target);
        if (cell === null || cell === stroke.cell) return;
        paint(cell);
        stroke.painted = true;
        afterChange();
      });

      const endStroke = (event) => {
        if (stroke === null) return;
        // A press that never moved is a click, not a drag.
        if (!stroke.painted) cycle(stroke.cell);
        stroke = null;
        afterChange();
      };
      boardEl.addEventListener('pointerup', endStroke);
      boardEl.addEventListener('pointercancel', () => { stroke = null; });

      document.getElementById('clear').addEventListener('click', () => load(Number(pickEl.value)));

      function load(index) {
        current = boards[index];
        marks = new Map();
        startedAt = null;
        elapsed = 0;
        solved = false;
        timerEl.textContent = '0:00';
        statusEl.textContent = '';
        delete statusEl.dataset.solved;
        pickEl.value = String(index);
        render();
      }

      // The manifest is generated alongside the boards, so adding a board is a
      // re-run of the generator rather than an edit to this file.
      const base = './';
      const manifest = await (await fetch(`${base}manifest.json`)).json();
      for (const entry of manifest) {
        const data = await (await fetch(`${base}${entry.file}`)).json();
        boards.push({ id: entry.label, size: data.board.size, regions: data.board.regions, score: entry.score });
        const opt = document.createElement('option');
        opt.value = String(boards.length - 1);
        opt.textContent = `${entry.label} — ours scores ${entry.score}`;
        pickEl.append(opt);
      }
      pickEl.addEventListener('change', () => load(Number(pickEl.value)));
      load(0);
    </script>
  </body>
</html>
