<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Queens test set</title>
    <style>
      /* Self-contained on purpose. This is a diagnostic page for one person, not
         a feature of the site: it is linked from nowhere, so it cannot appear in
         a menu, an archive, or a search result, and it cannot break the app
         because the app does not know it exists. */
      :root {
        color-scheme: light dark;
        --ink: #16181d;
        --paper: #fbfbfd;
        --line: #c9ccd4;
      }
      @media (prefers-color-scheme: dark) {
        :root { --ink: #e8e9ee; --paper: #16181d; --line: #3a3e48; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 1.5rem 1rem 4rem;
        background: var(--paper);
        color: var(--ink);
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      main { max-width: 34rem; margin: 0 auto; }
      h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
      p.hint { margin: 0 0 1.25rem; opacity: .75; font-size: .9rem; }
      .bar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: 1rem; }
      button, select {
        font: inherit; padding: .4rem .7rem; border-radius: .4rem;
        border: 1px solid var(--line); background: transparent; color: inherit;
      }
      button { cursor: pointer; }
      button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
      #timer { font-variant-numeric: tabular-nums; margin-left: auto; font-size: 1.1rem; }
      #board { display: grid; gap: 2px; touch-action: manipulation; }
      .cell {
        aspect-ratio: 1; border: 0; border-radius: 3px; padding: 0;
        display: grid; place-items: center; position: relative;
        font-size: clamp(.7rem, 3.5vw, 1.05rem); font-weight: 700;
        color: rgba(0,0,0,.42);
      }
      .cell[data-q="1"] { outline: 3px solid var(--ink); outline-offset: -3px; }
      .cell[data-q="1"]::after {
        content: "♛"; position: absolute; font-size: clamp(1.1rem, 6vw, 2rem);
        color: var(--ink); line-height: 1;
      }
      .cell[data-q="1"] > span { visibility: hidden; }
      #status { margin-top: 1rem; min-height: 1.5rem; font-weight: 600; }
      #log { margin-top: 1.5rem; }
      #log table { border-collapse: collapse; width: 100%; font-size: .9rem; }
      #log th, #log td { text-align: left; padding: .25rem .5rem .25rem 0; border-bottom: 1px solid var(--line); }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    </style>
  </head>
  <body>
    <main>
      <h1>Queens test set</h1>
      <p class="hint">
        One queen per colour, and no two touching &mdash; not even diagonally.
        Click a cell to place or remove a queen.
      </p>

      <div class="bar">
        <label for="pick" class="sr">Board</label>
        <select id="pick"></select>
        <button id="check" type="button">Check</button>
        <button id="clear" type="button">Clear</button>
        <span id="timer">0:00</span>
      </div>

      <div id="board" role="grid" aria-label="Queens board"></div>
      <p id="status" role="status" aria-live="polite"></p>

      <div id="log">
        <h2 style="font-size:1rem">Times</h2>
        <table>
          <thead><tr><th>Board</th><th>Time</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>

    <script type="module">
      // Twelve hues chosen to stay apart at a glance and to survive a greyscale
      // print, where the region letter is the fallback that still identifies it.
      const PALETTE = [
        '#e8853f', '#7b6cd9', '#3fa9e8', '#4caf6e', '#e05c8a', '#c9a227',
        '#3fbfa8', '#8f6bb8', '#d9534f', '#5b8fd6', '#7fa617', '#b08968',
      ];

      const boardEl = document.getElementById('board');
      const pickEl = document.getElementById('pick');
      const statusEl = document.getElementById('status');
      const timerEl = document.getElementById('timer');
      const rowsEl = document.getElementById('rows');

      /** @type {{id: string, size: number, regions: number[], score: number}[]} */
      let boards = [];
      let current = null;
      let queens = new Set();
      let startedAt = null;
      let elapsed = 0;

      const fmt = (ms) => {
        const s = Math.floor(ms / 1000);
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
      };

      function tick() {
        if (startedAt === null) return;
        elapsed = Date.now() - startedAt;
        timerEl.textContent = fmt(elapsed);
      }
      setInterval(tick, 250);

      function regionColour(id) {
        return PALETTE[id % PALETTE.length];
      }

      function render() {
        const { size, regions } = current;
        boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
        boardEl.replaceChildren();
        for (let cell = 0; cell < regions.length; cell += 1) {
          const id = regions[cell];
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cell';
          btn.dataset.q = queens.has(cell) ? '1' : '0';
          btn.style.background = regionColour(id);
          btn.setAttribute('role', 'gridcell');
          btn.setAttribute('aria-label', `Row ${Math.floor(cell / size) + 1}, column ${(cell % size) + 1}, region ${String.fromCharCode(65 + id)}`);
          btn.append(Object.assign(document.createElement('span'), { textContent: String.fromCharCode(65 + id) }));
          btn.addEventListener('click', () => {
            if (startedAt === null) { startedAt = Date.now(); }
            if (queens.has(cell)) queens.delete(cell); else queens.add(cell);
            render();
          });
          boardEl.append(btn);
        }
      }

      /** True when the placement satisfies every Queens rule. Never reveals how. */
      function isSolved(size, regions) {
        if (queens.size !== size) return false;
        const seen = new Set();
        for (const cell of queens) {
          if (seen.has(regions[cell])) return false;
          seen.add(regions[cell]);
          const r = Math.floor(cell / size), c = cell % size;
          for (let dr = -1; dr <= 1; dr += 1) {
            for (let dc = -1; dc <= 1; dc += 1) {
              if (dr === 0 && dc === 0) continue;
              const nr = r + dr, nc = c + dc;
              if (nr < 0 || nr >= size || nc < 0 || nc >= size) continue;
              if (queens.has(nr * size + nc)) return false;
            }
          }
        }
        return true;
      }

      function load(index) {
        const b = boards[index];
        current = b;
        queens = new Set();
        startedAt = null;
        elapsed = 0;
        timerEl.textContent = '0:00';
        statusEl.textContent = '';
        pickEl.value = String(index);
        render();
      }

      document.getElementById('clear').addEventListener('click', () => {
        queens = new Set();
        startedAt = null;
        elapsed = 0;
        timerEl.textContent = '0:00';
        statusEl.textContent = '';
        render();
      });

      document.getElementById('check').addEventListener('click', () => {
        tick();
        const solved = isSolved(current.size, current.regions);
        statusEl.textContent = solved
          ? `Solved in ${fmt(elapsed)}.`
          : `${queens.size} of ${current.size} queens placed — not solved yet.`;
        if (solved && !rowsEl.querySelector(`[data-board="${current.id}"]`)) {
          const tr = document.createElement('tr');
          tr.dataset.board = current.id;
          tr.innerHTML = `<td>${current.id}</td><td>${fmt(elapsed)}</td>`;
          rowsEl.append(tr);
        }
      });

      // The manifest is generated alongside the boards, so adding a board is a
      // re-run of the generator rather than an edit to this file.
      const res = await fetch(`${import.meta.env?.BASE_URL ?? './'}manifest.json`);
      const manifest = await res.json();
      for (const entry of manifest) {
        const data = await (await fetch(`${import.meta.env?.BASE_URL ?? './'}${entry.file}`)).json();
        boards.push({
          id: entry.label,
          size: data.board.size,
          regions: data.board.regions,
          score: entry.score,
        });
        const opt = document.createElement('option');
        opt.value = String(boards.length - 1);
        opt.textContent = `${entry.label} — ours scores ${entry.score}`;
        pickEl.append(opt);
      }
      pickEl.addEventListener('change', () => load(Number(pickEl.value)));
      load(0);
    </script>
  </body>
</html>
