name: monitor-publish

# Runs a few hours after publish-daily. A publisher that fails before pushing
# leaves main short a slot; this check reads the committed archive rather than
# the failed run's working tree, so the outage becomes a failed scheduled run.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Check the publishing horizon
        run: uv run python -m tools.publish --out ../app/public/puzzles --check
