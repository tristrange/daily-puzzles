name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Not for humans so much as for publish.yml: a commit made with the default
  # GITHUB_TOKEN does not raise a push event, by design, so the daily puzzle
  # would never reach the deploy below. See publish.yml.
  workflow_dispatch:

# Least privilege: CI checks out the repository and runs tests, and that is all.
# Without this the workflow inherits whatever the repository's default token
# permissions happen to be, which is not something a test run needs.
permissions:
  contents: read

# Superseded PR runs are disposable; main/publisher runs keep independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.scope.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CI routing
        run: python3 -m unittest discover -s .github/scripts -p 'test_ci_scope.py'
      - name: Select checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/ci_scope.py >> "$GITHUB_OUTPUT"

  engine:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Test
        run: uv run pytest -q --durations=15
      - name: Typecheck
        run: uv run pyright
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Verify published puzzles
        run: uv run python -m tools.verify --dir ../app/public/puzzles
      - name: Schema id pattern matches the manifest
        run: uv run python -m tools.schema_ids --check

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  deploy:
    # Main only, and only after both gates are green. The engine job re-verifies
    # every published puzzle, and shipping a site whose puzzle files do not
    # verify is the one failure worth waiting for — so this waits rather than
    # repeating the verification.
    #
    # Both events reach here: a human push, and the dispatch publish.yml sends
    # after committing a puzzle, which a push alone could not produce.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [engine, app]
    runs-on: ubuntu-latest
    # Overrides the workflow-level grant: deploying needs to write the Pages
    # site and to mint an OIDC token for the attestation. Nothing else in this
    # workflow does.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      # Queue deploys rather than cancelling one in flight: a half-published
      # site is worse than a slightly stale one.
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
        working-directory: app
      - name: Synchronize optional leaderboard catalog
        env:
          # This job runs on trusted main only. Keep this key out of build env.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -n "$SUPABASE_SECRET_KEY" ]; then
            if ! node backend/leaderboard/sync-catalog.mjs; then
              echo "::warning::Leaderboard catalog sync failed; publishing puzzles continues. Retry on the next deployment."
            fi
          else
            echo "Leaderboard catalog is not configured; skipping sync."
          fi
      - name: Build
        working-directory: app
        env:
          # A Pages project site is served from /<repo>/, so the built asset
          # URLs and the app's own puzzle fetches both need that prefix.
          BASE_PATH: /${{ github.event.repository.name }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
