name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI checks out the repository and runs tests, and that is all.
# Without this the workflow inherits whatever the repository's default token
# permissions happen to be, which is not something a test run needs.
permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Test
        run: uv run pytest -q
      - name: Typecheck
        run: uv run pyright
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Verify published puzzles
        run: uv run python -m tools.verify --dir ../app/public/puzzles

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build